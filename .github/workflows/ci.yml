
name: TaskFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Test and Build Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root_password
          MYSQL_DATABASE: taskflow_test
          MYSQL_USER: taskflow_test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3307
      MYSQL_DATABASE: taskflow_test
      MYSQL_USER: taskflow_test_user
      MYSQL_PASSWORD: test_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Initialize test database
        run: |
          sed '/^CREATE DATABASE /d; /^USE /d' database/init.sql > /tmp/taskflow-test-init.sql
          docker exec -i "${{ job.services.mysql.id }}" \
            sh -c 'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" "$MYSQL_DATABASE"' \
            < /tmp/taskflow-test-init.sql

      - name: Run automated API tests
        working-directory: ./backend
        run: npm test

      - name: Check backend JavaScript syntax
        run: node --check backend/server.js

      - name: Check database module syntax
        run: node --check backend/db.js

      - name: Check frontend JavaScript syntax
        run: node --check frontend/script.js

      - name: Build backend Docker image
        run: docker build -t taskflow-backend:ci ./backend

      - name: Build frontend Docker image
        run: docker build -t taskflow-frontend:ci -f frontend/Dockerfile .

      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish backend Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/paramigunasekara/taskflow-backend:latest
            ghcr.io/paramigunasekara/taskflow-backend:${{ github.sha }}

      - name: Publish frontend Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/paramigunasekara/taskflow-frontend:latest
            ghcr.io/paramigunasekara/taskflow-frontend:${{ github.sha }}
