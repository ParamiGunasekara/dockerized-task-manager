
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | Task Manager</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="container">

        <header class="header">
            <span class="brand">TASKFLOW</span>
            <h1>Manage your tasks.</h1>
            <p>Organize your day, one task at a time.</p>
        </header>

        <section class="stats">
            <div class="stat-card">
                <p>Total Tasks</p>
                <h2 id="total-count">0</h2>
            </div>

            <div class="stat-card">
                <p>Pending</p>
                <h2 id="pending-count">0</h2>
            </div>

            <div class="stat-card">
                <p>Completed</p>
                <h2 id="completed-count">0</h2>
            </div>
        </section>

        <section class="task-section">

            <h2>Add a new task</h2>

            <form id="task-form">
                <input
                    type="text"
                    id="task-input"
                    placeholder="What needs to be done?"
                    maxlength="200"
                    aria-label="Task name"
                    required
                >
                <button type="submit">+ Add Task</button>
            </form>

            <div class="task-header">
                <h2>My Tasks</h2>

                <div class="filters">
                    <button class="filter active" data-filter="all">All</button>
                    <button class="filter" data-filter="pending">Pending</button>
                    <button class="filter" data-filter="completed">Completed</button>
                </div>
            </div>

            <p id="status-message" role="status"></p>

            <ul id="task-list"></ul>

        </section>

        <footer>
            <p>TaskFlow — A Full-Stack DevOps Project</p>
            <p>Docker · NGINX · Node.js · MySQL</p>
        </footer>

    </main>

</body>
</html>
